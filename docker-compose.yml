services:
  db:
    image: pgvector/pgvector:pg16
    container_name: voice_notes_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voice_notes_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voice_notes_password}
      POSTGRES_DB: ${POSTGRES_DB:-voice_notes}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voice_notes_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voice_notes_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voice_notes_backend
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      HF_ACCESS_TOKEN: ${HF_ACCESS_TOKEN}
      POSTGRES_USER: ${POSTGRES_USER:-voice_notes_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voice_notes_password}
      POSTGRES_DB: ${POSTGRES_DB:-voice_notes}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
      VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - voice_notes_network

volumes:
  postgres_data:

networks:
  voice_notes_network:
    driver: bridge
