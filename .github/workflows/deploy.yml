name: VoiceNotes CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: oven-sh/setup-bun@v1

      - name: Build and deploy frontend
        run: |
          cd frontend
          bun install
          bun run build
          bunx firebase-tools deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_ID }} --token ${{ secrets.FIREBASE_TOKEN }}
        env:
          VITE_FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          VITE_BACKEND_URL: ${{ vars.BACKEND_URL }}

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set GCP project
        run: gcloud config set project ${{ secrets.GCP_PROJECT_ID }}

      - name: Build Docker image
        run: |
          cd backend
          gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/voicenotes-api --suppress-logs || true

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy voicenotes-api \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/voicenotes-api \
            --region europe-west3 \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --timeout 90 \
            --set-env-vars "ENV=prod,\
              OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},\
              POSTGRES_USER=${{ secrets.POSTGRES_USER }},\
              POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }},\
              POSTGRES_DB=${{ secrets.POSTGRES_DB }},\
              POSTGRES_HOST=${{ secrets.POSTGRES_HOST }},\
              GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }},\
              GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }},\
              VITE_BACKEND_URL=${{ vars.BACKEND_URL }},\
              VITE_FRONTEND_URL=${{ vars.FRONTEND_URL }},\
              TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}"
